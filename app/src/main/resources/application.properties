spring.application.name=back-end

# Real credentials live in application-local.properties (git-ignored, not committed).
# Copy this file locally and fill in your own values to run the app.
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=jdbc:mysql://<mysql_host>/cms?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root

spring.datasource.password=<mysql_password>
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.data.mongodb.uri=mongodb://<mongodb_host>:27017/prescriptions

management.endpoint.health.show-details=always
management.health.db.enabled=true


api.path=/
jwt.secret=$!@#$^%$$$%####$DDCPN0234FCFDPD8670M



spring.web.resources.static-locations=classpath:/static/

# -------------------------
# Thymeleaf Configuration
# -------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8